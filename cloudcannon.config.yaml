paths:
  static: public
  uploads: public/uploads
collections_config:
  pages:
    path: content/pages
    url: /[slug]
    icon: wysiwyg
    _enabled_editors:
      - visual
      - data
    schemas:
      default:
        name: New Page
        path: schemas/page.md
        new_preview_url: /about
      blog_index:
        name: Blog index
        path: schemas/blog-index.md
    add_options:
      - name: New Page
        schema: default
        icon: wysiwyg
  blog:
    path: content/posts
    url: /blog/[slug]
    icon: post_add
    _enabled_editors:
      - visual
      - content
      - data
    schemas:
      default:
        path: schemas/post.mdx
  data:
    path: data
    glob:
      - '**/*.json'
    disable_url: true
    disable_add: true
    disable_add_folder: true
    icon: settings
    _enabled_editors:
      - data

collection_groups:
  - heading: Content
    collections:
      - pages
      - blog
  - heading: Site
    collections:
      - data

data_config:
  nav:
    path: data/nav.json
  footer:
    path: data/footer.json
  blog:
    path: data/blog.json

file_config:
  - glob: data/nav.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: menu
      logo:
        type: image
      items:
        type: array
        options:
          structures: _structures.nav_items
      button:
        type: object
        options:
          preview:
            icon: ads_click
      text:
        type: text
      link:
        type: url
  - glob: data/footer.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: bottom_navigation
      logo:
        type: image
      logo_url:
        type: url
        comment: Link for the logo in the top left of the footer
      copyright:
        type: text
        comment: Automatically prefixed with the current year
      social:
        type: array
        options:
          structures: _structures.footer_social
      sections:
        type: array
        options:
          structures: _structures.footer_sections
      title:
        type: text
      text:
        type: text
      link:
        type: url
  - glob: data/blog.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: post_add
      recent_posts_title:
        type: text
        comment: Heading above the recent posts at the end of each blog post
      reading_time_label:
        type: text
        comment: Shown after the reading time in minutes on each blog post
      word_count_label:
        type: text
        comment: Shown after the word count on each blog post
  - glob: data/site.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: travel_explore
      baseurl:
        type: url
      site_title:
        type: text
      description:
        type: textarea
      favicon_icon:
        type: image
        comment: For the shortcut icon meta tag
      favicon_image:
        type: image
        comment: For the icon meta tag
      twitter_site:
        type: twitter
      image:
        type: image
      image_alt:
        type: text
  - glob: data/theme.json
    _inputs:
      $:
        type: object
        options:
          preview:
            icon: palette
      primary_color:
        type: color
      secondary_color:
        type: color
      anchor_color:
        type: color
      background_effects_color:
        type: color

_inputs:
  _type:
    hidden: true
  _schema:
    hidden: true
  content_blocks:
    type: array
    options:
      structures: _structures.content_blocks
  title:
    type: text
  description:
    type: markdown
    options:
      bold: true
      italic: true
      link: true
      removeformat: true
      undo: true
      redo: true
  date:
    type: datetime
    instance_value: NOW
    comment: Changes to the date show on the page after the next build
  author:
    type: text
  tags:
    type: array
    comment: Each tag gets its own listing page
  tags[*]:
    type: text
  image:
    type: image
  image_alt:
    type: text
    comment: Describes the image for screen readers
  thumbImg:
    type: object
    options:
      preview:
        icon: image
  featuredImg:
    type: object
    options:
      preview:
        icon: image
  thumbImg.image:
    type: image
  featuredImg.image:
    type: image
  pagination:
    type: object
    options:
      preview:
        icon: format_list_numbered
  pagination.size:
    type: number
  seo:
    type: object
    options:
      preview:
        icon: travel_explore
  page_description:
    type: textarea
    comment: Defaults to the description set in the Site SEO data file
  canonical_url:
    type: text
    comment: Defaults to the pages url
  featured_image:
    type: image
    comment: Defaults to the image set in the Site SEO data file
  featured_image_alt:
    type: text
  open_graph_type:
    type: select
    comment: Defaults to the type 'website'
    options:
      allow_empty: true
      values:
        - website
        - article
  author_twitter_handle:
    type: text
    comment: Defaults to the twitter site value set in the Site SEO data file
  no_index:
    type: checkbox
    comment: >-
      When selected this removes the page from your sitemap and adds the noindex
      robots meta tag

_editables:
  content:
    embed: true
    snippet: true
    blockquote: true
    bold: true
    format: p h1 h2 h3 h4 h5 h6 pre address div
    italic: true
    link: true
    strike: true
    subscript: true
    superscript: true
    underline: true

_snippets_imports:
  mdx: true

_snippets:
  mdx_iframe:
    template: mdx_component
    inline: false
    preview:
      text: Iframe
      subtext:
        - key: src
    definitions:
      component_name: IframeComponent
      named_args:
        - source_key: src
          editor_key: src
          type: string
    _inputs:
      src:
        type: url
  button:
    template: mdx_component
    inline: false
    preview:
      text: Button
      subtext:
        - key: button_text
    definitions:
      component_name: ButtonSnippet
      named_args:
        - source_key: button_text
          editor_key: button_text
          type: string
        - source_key: button_link
          editor_key: button_link
          type: string
    _inputs:
      button_link:
        type: url

